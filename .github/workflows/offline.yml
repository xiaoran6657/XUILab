name: Offline infrastructure checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install pinned offline test dependencies
        run: python -m pip install --only-binary=:all: -r Tools/requirements-ci.txt
      - name: Run the explicit offline check plan
        run: python -B Tools/Automation/run_checks.py run --run-id ci-offline --timeout-seconds 300
      - name: Verify publishing boundaries
        run: python -B -m unittest discover -s Tools/Publishing -p test_*.py -v
      - name: Check tracked showcase fingerprints
        run: python -B Tools/Publishing/check_tracked_assets.py
