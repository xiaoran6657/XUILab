name: Offline infrastructure checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Tools/**'
      - 'Docs/**'
      - '.agents/**'
      - '.github/workflows/offline.yml'
      - 'AGENTS.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Run the explicit offline check plan
        run: python -B Tools/Automation/run_checks.py run --run-id ci-offline --timeout-seconds 300
